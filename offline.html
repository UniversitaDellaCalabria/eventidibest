<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sei offline - EventiDiBEST</title>
    <style>
        :root {
            --red: #990000;
            --red-dark: #6b0000;
            --slate: #1e293b;
            --muted: #64748b;
            --bg: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--slate);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            text-align: center;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            padding: 3rem 2.5rem;
            max-width: 480px;
            width: 100%;
        }
        .icon-wrap {
            width: 88px;
            height: 88px;
            background: #fff0f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }
        .icon-wrap svg {
            width: 44px;
            height: 44px;
            stroke: var(--red);
        }
        h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: .5rem; color: var(--red); }
        p  { font-size: 1rem; color: var(--muted); line-height: 1.6; margin-bottom: 1.5rem; }
        .brand {
            font-size: .8rem;
            color: var(--muted);
            border-top: 1px solid #e2e8f0;
            padding-top: 1.5rem;
            margin-top: 2rem;
        }
        .brand strong { color: var(--slate); }
        .btn-retry {
            display: inline-block;
            background: var(--red);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: .95rem;
            padding: .75rem 2rem;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            transition: background .2s;
        }
        .btn-retry:hover { background: var(--red-dark); }
        .dots {
            display: flex;
            justify-content: center;
            gap: .4rem;
            margin-bottom: 2rem;
        }
        .dots span {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #e2e8f0;
            animation: pulse 1.4s infinite ease-in-out;
        }
        .dots span:nth-child(2) { animation-delay: .2s; }
        .dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes pulse {
            0%, 80%, 100% { background: #e2e8f0; transform: scale(1); }
            40% { background: var(--red); transform: scale(1.3); }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Icona wifi-off -->
        <div class="icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"/>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
                <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                <line x1="12" y1="20" x2="12.01" y2="20"/>
            </svg>
        </div>

        <h1>Sei offline</h1>
        <p>Non è stato possibile connettersi al portale. Verifica la tua connessione a internet e riprova.</p>

        <div class="dots">
            <span></span><span></span><span></span>
        </div>

        <button class="btn-retry" onclick="window.location.reload()">
            Riprova
        </button>

        <div class="brand">
            <strong>EventiDiBEST</strong><br>
            Portale Eventi e Laboratori — DiBEST · Università della Calabria
        </div>
    </div>

    <script>
        // Quando torna online, ricarica automaticamente
        window.addEventListener('online', () => window.location.reload());
    </script>
</body>
</html>
